# Lint and smoke-test every push and pull request. When a push to main passes,
# fast-forward the prod branch to it: Streamlit Community Cloud deploys from prod,
# so only tested commits go live.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Same Python as production (set in Streamlit Cloud's Advanced settings).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # requirements.txt is the full lock, so this installs exactly what production does.
      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.14.5

      - name: Lint
        run: ruff check app.py core run_core_tests.py

      # Models are pinned by commit in core/models.py, so that file keys the cache.
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('core/models.py') }}

      - name: Smoke test
        run: python run_core_tests.py

  promote:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Fast-forward only: if prod was changed by hand, this fails instead of overwriting it.
      # GitHub refuses this push when the commit changes files in .github/workflows;
      # then push it yourself after CI passes: git push origin main:prod
      - name: Fast-forward prod to this commit
        run: git push origin HEAD:refs/heads/prod
